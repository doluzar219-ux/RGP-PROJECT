name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify the build produced an entry point
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html was not produced"; exit 1; }
          echo "✔ dist/index.html present ($(du -h dist/index.html | cut -f1))"

      - name: Upload build artifact
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: life-rpg-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
